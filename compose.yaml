services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bibliovicino}
      POSTGRES_USER: ${POSTGRES_USER:-bibliovicino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bibliovicino}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-database.sh:/docker-entrypoint-initdb.d/10-test-database.sh:ro

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    environment:
      APP_SECRET: ${APP_SECRET:-dev-bibliovicino-change-me-in-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bibliovicino}:${POSTGRES_PASSWORD:-bibliovicino}@database:5432/${POSTGRES_DB:-bibliovicino}?serverVersion=17&charset=utf8
    command: >-
      sh -c "composer install --no-interaction --prefer-dist
      && php -S 0.0.0.0:8000 -t public public/index.php"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "${BACKEND_PORT:-8080}:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - bookcopy_covers:/var/lib/bibliovicino/covers

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  bookcopy_covers:
  backend_vendor:
  database_data:
  frontend_node_modules:
